<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:rgba(0,0,0,.06)}
body{margin:0;background:#F0F1F3;color:#16202B;
 font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:24px}
button,select,textarea,input{font:inherit}
button{touch-action:manipulation}
header{background:#12315C;color:#fff;padding:11px 12px}
.top{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.top .bk{background:#1E4A85;border:0;color:#fff;padding:8px 12px;border-radius:6px;font-size:14px}
.top .tt{font-size:15.5px;font-weight:600;flex:1}
select.who{width:100%;padding:10px;border:0;border-radius:6px;background:#1E4A85;color:#fff;font-size:15px}
main{padding:12px;max-width:620px;margin:0 auto}
h2{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:#77838F;margin:18px 0 8px}
h2:first-child{margin-top:0}

.r{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:#fff;border:0;
 border-radius:9px;padding:13px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.r:active{background:#EDF2EE}
.r .ml{flex:1;min-width:0}
.r .ml b{display:block;font-size:15px;line-height:1.3}
.r .ml span{font-size:12px;color:#8592A0}
.r .rt{flex:none;text-align:right}
.r .rt b{display:block;font-size:20px;line-height:1;color:#12315C}
.r .rt span{font-size:10.5px;color:#8592A0}
.r .ar{flex:none;color:#B4BCC4;font-size:17px}
.r.lt{border-left:4px solid #B2402F}
.r.ok{border-left:4px solid #2E7D4B}
.r.wt{border-left:4px solid #C08A1E}

.big{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#12315C;color:#fff;
 border:0;border-radius:10px;padding:15px 14px;margin-bottom:10px}
.big b{font-size:17px;display:block}
.big span{font-size:12.5px;color:#B6CCEA}
.big .num{margin-left:auto;font-size:30px;font-weight:700}

.acts{display:flex;gap:8px;margin-top:10px}
.acts button{flex:1;background:#fff;border:0;border-radius:9px;padding:14px 8px;font-size:13px;
 font-weight:600;color:#12315C;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.acts button:active{background:#EDF2EE}
.acts button i{display:block;font-style:normal;font-size:19px;margin-bottom:5px}

.card{background:#fff;border-radius:9px;padding:13px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.card h3{margin:0 0 10px;font-size:14px}
.kv{display:flex;gap:8px;margin-bottom:10px}
.kv div{flex:1;background:#fff;border-radius:9px;padding:11px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.kv b{display:block;font-size:21px;line-height:1.1;color:#12315C}
.kv span{font-size:11px;color:#5A6672}
.kv div.bad b{color:#B2402F}

.li{padding:9px 0;border-bottom:1px solid #F0F2F4;font-size:14px}
.li:last-child{border-bottom:0}
.li .h{display:flex;justify-content:space-between;gap:8px}
.li .h b{font-weight:600}
.li .h i{font-style:normal;font-size:11.5px;color:#8592A0;flex:none}
.li .s{font-size:12px;color:#8592A0;margin-top:2px}
.li.late .h i{color:#B2402F;font-weight:600}
.sub{display:block;width:100%;text-align:left;background:#F7F8F9;border:0;border-radius:7px;
 padding:9px 10px;margin-top:6px;font-size:13px;color:#16202B}
.sub:active{background:#E9EEF1}
.sub span{display:block;font-size:11.5px;color:#8592A0;margin-top:2px}
.sub span.l{color:#B2402F;font-weight:600}
.bar{height:7px;background:#EDEFF1;border-radius:4px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:#2E7D4B}
.bar i.w{background:#C08A1E}
.msg{margin-top:5px;background:#FBF4E4;border-left:3px solid #C08A1E;padding:7px 9px;border-radius:4px;
 font-size:12.5px;color:#5A4A22}

/* organizasyon */
.org{background:#fff;border-radius:9px;padding:13px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.org .dir{background:#12315C;color:#fff;border-radius:8px;padding:12px;text-align:center;margin-bottom:12px}
.org .dir b{display:block;font-size:16px}
.org .dir span{font-size:11.5px;color:#B6CCEA}
.ob{border:1px solid #DDE2E6;border-radius:8px;margin-bottom:9px;overflow:hidden}
.ob .oh{background:#EDF3EE;padding:10px 12px;border-bottom:1px solid #DDE2E6}
.ob .oh b{font-size:14px;color:#1E5C36}
.ob .oh span{display:block;font-size:11px;color:#5A6672;margin-top:1px}
.ob .op{padding:8px 12px;font-size:13.5px;border-bottom:1px solid #F2F4F5}
.ob .op:last-child{border-bottom:0}
.ob .op span{display:block;font-size:11px;color:#8592A0}
.ob .op.sef b:after{content:' ★';color:#C08A1E;font-size:11px}
.ob .oe{padding:8px 12px;font-size:12.5px;color:#8592A0;font-style:italic}

.fl{background:#fff;border-radius:9px;padding:13px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.fl .fh{font-size:14px;font-weight:600;color:#1E5C36;margin-bottom:10px}
.stg{display:flex;align-items:stretch;gap:6px}
.stg .nd{flex:1;background:#F4F6F8;border:1px solid #DDE2E6;border-radius:7px;padding:9px 8px;text-align:center;min-width:0}
.stg .nd b{display:block;font-size:12.5px;line-height:1.25;word-break:break-word}
.stg .nd span{font-size:10px;color:#8592A0}
.stg .nd.s1{background:#EDF3EE;border-color:#BBD6C4}
.stg .nd.s2{background:#FBF4E4;border-color:#E4D0A5}
.stg .ok{flex:none;display:flex;align-items:center;color:#8592A0;font-size:17px;font-weight:700}
.edt{margin-top:10px;padding-top:10px;border-top:1px solid #F0F2F4}
.edt label{margin:8px 0 4px}
.ky{display:inline-block;background:#FBF4E4;color:#8A6512;font-size:10.5px;font-weight:700;
 padding:2px 7px;border-radius:10px;margin-left:6px;vertical-align:middle}
svg.ch{display:block;width:100%;height:auto;max-width:340px;margin:0 auto}
.lg2{display:flex;gap:12px;font-size:11.5px;color:#5A6672;margin-top:6px;flex-wrap:wrap}
.lg2 span{display:flex;align-items:center;gap:5px}
.lg2 i{width:9px;height:9px;border-radius:2px;display:block}
.rw{margin-bottom:9px;font-size:13.5px}
.rw .t{display:flex;justify-content:space-between;gap:8px;margin-bottom:3px}
.rw .t i{font-style:normal;color:#5A6672;font-size:12px;flex:none}
label{display:block;font-size:12px;font-weight:600;color:#5A6672;margin:12px 0 5px}
input,textarea,select.n{width:100%;padding:11px;border:1px solid #CDD3D9;border-radius:7px;
 font-size:16px;background:#fff}
textarea{min-height:76px;resize:vertical}
.b{width:100%;padding:13px;border:0;border-radius:8px;background:#2E7D4B;color:#fff;font-weight:600;font-size:15px}
.b.g{background:#fff;color:#12315C;border:1px solid #CDD3D9}
.b.r{background:#B2402F}
.b:active{opacity:.75}
.two{display:flex;gap:8px}
.two .b{flex:1}
.sr{display:flex;gap:6px;margin-bottom:8px}
.sr input.d{width:60px;flex:none;text-align:center}
.sr button{width:42px;flex:none;border:1px solid #CDD3D9;background:#fff;border-radius:7px;color:#B2402F;font-size:18px}
.emp{background:#fff;border-radius:9px;padding:24px 16px;text-align:center;color:#8592A0;font-size:13.5px}
.note{font-size:11.5px;color:#8592A0;margin-top:8px;line-height:1.45}
.atkart{border:2px solid #C0392B;background:#FEF6F5}
.atkart h3{color:#B2402F}
.atkart .an{font-size:13.5px;font-weight:600;margin-bottom:3px;color:#16202B}
.atkart .am{font-size:11px;color:#8592A0;margin-bottom:8px}
.atkart .arow{border-top:1px solid #F3D2CD;padding:10px 0}
.tehlike{border:1px solid #F3D2CD;background:#FDF5F4}
.tehlike h3{color:#B2402F}
.tehlike .td{font-size:12px;color:#8592A0;margin-bottom:10px}
body.dk .atkart{background:#2A1614;border-color:#7A2A20}
body.dk .atkart h3{color:#F0A99E}
body.dk .atkart .an{color:#E4E9EE}
body.dk .atkart .am{color:#9AA4AE}
body.dk .atkart .arow{border-top-color:#5A2019}
body.dk .tehlike{background:#2A1614;border-color:#5A2019}
body.dk .tehlike h3{color:#F0A99E}
body.dk .tehlike .td{color:#9AA4AE}
.itab,.gtab,.dtab{border-collapse:separate;border-spacing:0;width:100%}
.dtab{font-size:13px;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(16,40,30,.05)}
.dtab th{background:linear-gradient(180deg,#F3F8F5,#E8F1EB);color:#20493A;font-weight:800;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;padding:11px 8px;text-align:center;white-space:nowrap;border-bottom:2px solid #D8E5DD}
.dtab th:first-child{text-align:left}
.dtab td{padding:13px 8px;text-align:center;border-bottom:1px solid #EFF2F0;cursor:pointer;font-weight:800;font-size:16px;color:#16202B;transition:background .12s,transform .05s}
.dtab tr:last-child td{border-bottom:0}
.dtab td.dbol{text-align:left;font-weight:700;font-size:12.5px;color:#20493A}
.dtab td.dbol::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:#2E7D4B;margin-right:8px;vertical-align:middle}
.dtab td:nth-child(2){color:#12315C}
.dtab td:nth-child(3){color:#1B5E3F;background:#F4FBF6}
.dtab td:nth-child(4){color:#155E88;background:#F1F8FC}
.dtab td:nth-child(5){color:#A9700D;background:#FFFBF1}
.dtab td:nth-child(6){color:#9AA6AF;background:#FAFBFB}
.dtab td.gechuc{background:#FCE7E4!important;color:#C0392B!important}
.dtab tr:hover td{background:#EFF6F1}
.dtab td:active{transform:scale(.94)}
.dtab tr.dtop td{background:#E9F0EC;font-weight:900;font-size:16px;border-top:2px solid #D8E5DD;color:#12315C;cursor:default}
.dtab tr.dtop td.gechuc{background:#FCE7E4!important}
.itab{font-size:12px;border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(16,40,30,.05)}
.itab th{background:linear-gradient(180deg,#F3F8F5,#E8F1EB);color:#20493A;font-weight:800;font-size:10px;letter-spacing:.03em;text-transform:uppercase;padding:10px 9px;text-align:left;white-space:nowrap;border-bottom:2px solid #D8E5DD;position:sticky;top:0}
.itab td{padding:9px 10px;border-bottom:1px solid #EFF2F0;white-space:nowrap;vertical-align:top;color:#37424E}
.itab tr{cursor:pointer;transition:background .12s}
.itab tr:nth-child(even) td{background:#F9FBFA}
.itab tr:hover td{background:#EFF6F1}
.itab tr:last-child td{border-bottom:0}
.itab .isad{white-space:normal;min-width:165px;font-weight:700;color:#16202B}
.itab td:nth-child(10){font-weight:600;color:#12315C}
.itab tr.gecsat td{background:#FDEEEC;box-shadow:inset 3px 0 0 #C0392B}
.itab tr.gecsat:hover td{background:#FCE4E1}
.gtab{font-size:12px;border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(16,40,30,.05)}
.gtab th{background:linear-gradient(180deg,#F3F8F5,#E8F1EB);color:#20493A;font-weight:800;font-size:10px;letter-spacing:.03em;text-transform:uppercase;padding:10px 9px;text-align:left;border-bottom:2px solid #D8E5DD}
.gtab td{padding:9px 10px;border-bottom:1px solid #EFF2F0;vertical-align:top;color:#37424E}
.gtab tr:last-child td{border-bottom:0}
.gtab td:nth-child(1){text-align:center;width:46px;font-weight:800;color:#2E7D4B;background:#F4FBF6}
.gtab td:nth-child(2){white-space:nowrap;font-weight:600;color:#16202B}
.gtab td:nth-child(3){white-space:normal;min-width:210px;line-height:1.5;color:#4A5561}
.gtab tr:hover td{background:#F7FAF8}
body.dk .itab,body.dk .gtab,body.dk .dtab{box-shadow:0 1px 3px rgba(0,0,0,.3)}
body.dk .dtab th,body.dk .itab th,body.dk .gtab th{background:linear-gradient(180deg,#26333B,#1F2A31);color:#CFE3D6;border-bottom-color:#33414A}
body.dk .dtab td,body.dk .itab td,body.dk .gtab td{border-bottom-color:#2A353D;color:#C6CED4}
body.dk .dtab td.dbol{color:#CFE3D6}
body.dk .dtab td:nth-child(3){background:#1B2A22;color:#7FC79B}
body.dk .dtab td:nth-child(4){background:#182530;color:#6FB2DC}
body.dk .dtab td:nth-child(5){background:#2A2417;color:#E0B060}
body.dk .dtab td:nth-child(6){background:#20272C;color:#9AA6AF}
body.dk .dtab td.gechuc{background:#3A1E1A!important;color:#F0A99E!important}
body.dk .dtab tr:hover td,body.dk .itab tr:hover td,body.dk .gtab tr:hover td{background:#26333B}
body.dk .dtab tr.dtop td{background:#1E272E;color:#CFE3D6}
body.dk .itab tr:nth-child(even) td{background:#20282E}
body.dk .itab .isad{color:#E4E9EE}
body.dk .itab tr.gecsat td{background:#3A1E1A;box-shadow:inset 3px 0 0 #C0392B}
body.dk .gtab td:nth-child(1){background:#1B2A22;color:#7FC79B}
body.dk .gtab td:nth-child(2){color:#E4E9EE}
.extgun td{background:#FDEEEC!important}
body.dk .extgun td{background:#3A1E1A!important}
.hk{display:none}
@media(max-width:599px){
 .hf{display:none}.hk{display:inline}
 .dtab{font-size:11px;table-layout:fixed}
 .dtab th{padding:8px 2px;font-size:9px;letter-spacing:0}
 .dtab td{padding:11px 2px;font-size:15px}
 .dtab th:first-child,.dtab td.dbol{width:82px;font-size:10.5px;line-height:1.15;word-break:break-word;padding-left:6px}
 .dtab td.dbol::before{width:5px;height:5px;margin-right:4px}
 .itab{font-size:11px}
 .itab th,.itab td{padding:7px 6px}
 .itab .isad{min-width:120px}
 .gtab th,.gtab td{padding:7px 7px}
}
/* ---- yatay şema ---- */
.ogrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;align-items:stretch}
.ogrid>div{display:flex}
.oc,.och,.obul li,.oper .pi b,.omgr b{word-break:break-word;overflow-wrap:anywhere;hyphens:auto}
.och{white-space:normal}
.tip{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
 padding:2px 6px;border-radius:4px;margin-left:6px;vertical-align:middle}
.tip.i{background:#E7EDF6;color:#1E4A85}
.tip.k{background:#FBF4E4;color:#8A6512}
.tip.o{background:#E4F0E8;color:#1E5C36}
body.dk .tip.i{background:#1B2C44;color:#8FB6EA}
body.dk .tip.k{background:#2A2416;color:#E3C98A}
body.dk .tip.o{background:#1D2A22;color:#8FD3AC}
.ekl{display:flex;gap:9px;align-items:center;padding:8px 0;border-bottom:1px solid #F0F2F4;font-size:13px}
.ekl:last-child{border-bottom:0}
.ekl .ic{width:34px;height:34px;flex:none;border-radius:6px;background:#EEF2F6;color:#12315C;
 display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
.ekl .ic.x{background:#E3F0E8;color:#1E5C36}
.ekl .ic.p{background:#F7E4E1;color:#8E2F21}
.ekl .nm{font-weight:600;line-height:1.25;word-break:break-word}
.ekl .mt{font-size:11px;color:#8592A0;margin-top:1px}
.thm{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:9px}
.thm img{width:100%;height:74px;object-fit:cover;border-radius:6px;background:#EEF2F6;display:block}
.upl{display:block;border:1.5px dashed #C3CAD1;border-radius:8px;padding:12px;text-align:center;
 color:#4C5966;font-size:13px;font-weight:600;background:#FAFBFC}
.upl input{display:none}
body.dk .upl{background:#1A1F26;border-color:#39424C;color:#A9B4BF}
body.dk .ekkc{background:#1E2730!important;color:#DDE3E9!important;border-color:#39424C!important}
body.dk .ekkc input{accent-color:#4C9BE0}
body.dk .ekl{border-bottom-color:#262D36}
body.dk .ekl .ic{background:#222A33;color:#8FB6EA}
.fs{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:30;display:flex;align-items:center;justify-content:center;padding:12px}
.fs img{max-width:100%;max-height:88vh;border-radius:6px}
.fs button{position:absolute;top:14px;right:14px;background:#fff;border:0;border-radius:6px;padding:9px 13px}
.swrap{overflow:hidden;position:relative}
.sch{width:1010px;transform-origin:top left}
.osubs{display:flex;gap:8px;margin-top:9px}
.osubs>div{flex:1;min-width:0;margin-top:0}
.zbtn{width:100%;background:#fff;border:1px solid #CDD3D9;border-radius:8px;padding:10px;
 font-size:13px;font-weight:600;color:#12315C;margin-bottom:8px}
body.dk .zbtn{background:#1A1F26;border-color:#333C46;color:#8FB6EA}
.sdir{width:420px;margin:0 auto}
.conn{position:relative;height:26px;margin:0 0 4px}
.conn .vt{position:absolute;top:0;left:50%;width:2px;height:11px;background:#2E7D4B}
.conn .hz{position:absolute;top:11px;left:100px;right:100px;height:2px;background:#2E7D4B}

 border-left:5px solid transparent;border-right:5px solid transparent;border-top:6px solid #2E7D4B}

.cols>div{flex:1;min-width:0}
.hint{font-size:11.5px;color:#8592A0;text-align:center;margin-bottom:6px}
/* ---- organizasyon şeması ---- */
.obas{text-align:center;font-size:17px;font-weight:700;color:#12315C;letter-spacing:.02em;
 border-bottom:3px solid #E8C34A;padding-bottom:8px;margin-bottom:14px}
.odir{background:#12315C;color:#fff;border-radius:8px;padding:14px;text-align:center;margin-bottom:6px}
.odir span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#A9C4E8}
.odir b{display:block;font-size:18px;margin-top:3px}
.oarr{text-align:center;color:#2E7D4B;font-size:18px;line-height:1;margin:2px 0 8px}
.oc{border:1.5px solid #2E7D4B;border-radius:12px;padding:10px;margin-bottom:0;background:#fff;
 display:flex;flex-direction:column;height:100%}
.och{background:#2E7D4B;color:#fff;border-radius:7px;padding:9px 11px;text-align:center;
 font-size:14px;font-weight:700;line-height:1.3}
.obul{list-style:none;margin:10px 0 0;padding:0}
.obul li{font-size:12px;color:#3B4A5A;padding:2px 0 2px 13px;position:relative;line-height:1.3}
.obul li:before{content:'•';position:absolute;left:2px;color:#2E7D4B;font-weight:700}
.osub{border:1px solid #DCE5DF;border-radius:8px;padding:8px;margin-top:9px;background:#FAFCFB}

function tonCal(dizi){
 try{
  var C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  var c=new C(),t=c.currentTime,son=0;
  dizi.forEach(function(f){
   var o=c.createOscillator(),g=c.createGain();
   o.type=f.tip||'sine';o.frequency.value=f.hz;o.connect(g);g.connect(c.destination);
   g.gain.setValueAtTime(0.0001,t+f.bas);
   g.gain.exponentialRampToValueAtTime(f.ses||0.3,t+f.bas+0.02);
   g.gain.exponentialRampToValueAtTime(0.0001,t+f.bas+f.sure);
   o.start(t+f.bas);o.stop(t+f.bas+f.sure+0.02);
   son=Math.max(son,f.bas+f.sure);
  });
  setTimeout(function(){try{c.close()}catch(e){}},(son+0.3)*1000);
 }catch(e){}
}

    var img=new Image();
    img.onload=function(){
      var mx=1600,w=img.width,h=img.height;
      if(w>mx||h>mx){var o=Math.min(mx/w,mx/h);w=Math.round(w*o);h=Math.round(h*o)}
      try{
        var cv=document.createElement('canvas');cv.width=w;cv.height=h;
        var cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,w,h);cx.drawImage(img,0,0,w,h);
        var q=0.72,out=cv.toDataURL('image/jpeg',q);

        cb(out);
      }catch(e){cb(rd.result)}
    };
    img.onerror=function(){cb(null)};
    img.src=rd.result;
  };
  rd.onerror=function(){cb(null)};
  rd.readAsDataURL(file);
}

  var r=await dbClient.from(tablo).upsert(satirlar);

   console.log('YAZMA HATASI ['+tablo+']:',r.error.message);
   if(adi){say(adi+' kaydedilemedi: '+r.error.message);}
   return false;
  }
